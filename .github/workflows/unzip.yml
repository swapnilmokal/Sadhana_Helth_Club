name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -q ./*.zip
          cp -r sadhana_health_nutrition_pwa/. .
          rm -rf sadhana_health_nutrition_pwa ./*.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Sadhana PWA files"
          git push
